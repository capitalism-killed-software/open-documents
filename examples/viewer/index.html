<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Documents editor</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; background: #f6f6f7; color: #1d1d1f; }
    header { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
    h1 { font-size: 1.1rem; margin: 0 1rem 0 0; }
    button { font: inherit; padding: .4rem .8rem; border-radius: 6px; border: 1px solid #1d1d1f; background: #1d1d1f; color: #fff; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    #status { color: #6e6e73; }
    body.dragging od-viewer { outline: 3px dashed #0b63ce; outline-offset: 4px; }
    od-viewer { --od-height: calc(100vh - 6rem); }
  </style>
</head>
<body>
  <header>
    <h1>Open Documents editor</h1>
    <button id="word" disabled title="Each page as it looks, with every line of text in a box you can edit">Download as Word</button>
    <span id="status">Open a PDF, or drop one here. Files stay on this computer.</span>
  </header>
  <od-viewer id="viewer" wasm-url="./pdfium.wasm" open="true" download="true" sidebar="true"
    annotate="true" organize="true" design="true" redact="true"></od-viewer>
  <script type="module" src="./app.js"></script>
</body>
</html>
