name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # converters are tested in the conversions job, where LibreOffice, Chromium and qpdf are installed
      - run: npm run check:portable

  conversions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: LibreOffice, qpdf and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress qpdf \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-noto-core
          soffice --version
          qpdf --version
      - run: npm ci
      - name: Chromium
        run: npx playwright-core install --with-deps chromium
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the image
        run: docker build -f docker/Dockerfile -t open-documents:ci .
      - name: Smoke test
        run: docker/smoke-test.sh open-documents:ci
