name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # converters are tested in the conversions job, where LibreOffice, Chromium and qpdf are installed
      - run: npm run check:portable

  conversions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: LibreOffice, qpdf and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress qpdf \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-noto-core
          soffice --version
          qpdf --version
      - run: npm ci
      - name: Chromium
        run: npx playwright-core install --with-deps chromium
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: packages/node/python/uv.lock
      - name: Docling worker
        working-directory: packages/node/python
        run: uv sync --frozen
      - uses: actions/cache@v5
        with:
          path: ~/.cache/open-documents/docling-models
          key: docling-models-${{ hashFiles('packages/node/python/uv.lock') }}
      - name: Docling models
        working-directory: packages/node/python
        run: test -d ~/.cache/open-documents/docling-models || uv run --frozen docling-tools models download layout tableformer -o ~/.cache/open-documents/docling-models
      - name: Worker tests and Python licences
        run: |
          (cd packages/node/python && uv run --frozen pytest -q)
          npm run licences:python
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the image
        run: docker build -f docker/Dockerfile -t open-documents:ci .
      - name: Smoke test
        run: docker/smoke-test.sh open-documents:ci
      - name: Build the full image, with Docling
        run: docker build -f docker/Dockerfile.full --build-arg BASE=open-documents:ci -t open-documents:ci-full .
      - name: Smoke test the full image
        run: FULL=1 docker/smoke-test.sh open-documents:ci-full
