name: publish

# Run by hand from the Actions tab. A dry run unless told otherwise.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would be published
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:portable
      - name: Publish
        # npm trusted publishing: npm trades the job's OIDC token for a short-lived one, so
        # there is no npm token stored anywhere. Each package lists this workflow on npmjs.com.
        # a version already on npm is skipped, so a package published by hand first (a new
        # package has to be, before trusted publishing can be set up for it) does not stop the rest
        run: |
          for p in core node server client cli viewer ocr; do
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "@open-documents/$p@$version" version >/dev/null 2>&1; then
              echo "@open-documents/$p@$version is on npm already"
              continue
            fi
            npm publish --workspace "@open-documents/$p" --access public --provenance ${{ inputs.dry_run && '--dry-run' || '' }}
          done
